name: Comprehensive Test Suite

on:
  push:
    branches: [ main, revamped-version, develop ]
  pull_request:
    branches: [ main, revamped-version, develop ]

permissions:
  contents: write
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pytest.ini') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock hypothesis faker psutil scipy
        pip install -r requirements.txt
        
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short -m unit
        
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short -m integration
        
    - name: Run empirical tests
      run: |
        pytest tests/empirical/ -v --tb=short -m empirical
        
    - name: Run tests with coverage
      run: |
        pytest --cov=v6_descriptive_statistics --cov-report=term-missing --cov-report=html --cov-report=json --ignore=test_env/

    - name: Extract coverage percentage and create badge
      run: |
        COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
        echo "::notice title=Coverage Percentage::Coverage: $COVERAGE%"
        echo "COVERAGE_PERCENTAGE=$COVERAGE" >> $GITHUB_ENV
        
        # Determine color based on coverage
        if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          COLOR="brightgreen"
        elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
          COLOR="yellow"  
        elif (( $(echo "$COVERAGE >= 40" | bc -l) )); then
          COLOR="orange"
        else
          COLOR="red"
        fi
        
        mkdir -p tests/
        curl -o tests/coverage-badge.svg "https://img.shields.io/badge/coverage-$COVERAGE%25-$COLOR"

    - name: Commit coverage badge
      if: github.ref == 'refs/heads/revamped-version'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add tests/coverage-badge.svg
        git diff --staged --quiet || git commit -m "Update coverage badge to $COVERAGE_PERCENTAGE%"
        git push

    - name: Check coverage threshold
      run: |
        coverage report --fail-under=50
        
    - name: Archive test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.json
          tests/coverage-badge.svg

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy
        pip install -r requirements.txt
        
    - name: Run Black code formatter check
      run: |
        black --check --diff v6-descriptive-statistics/ tests/
        
    - name: Run Flake8 linter
      run: |
        flake8 v6-descriptive-statistics/ tests/ --max-line-length=120 --extend-ignore=E203,W503
        
    - name: Run MyPy type checker
      run: |
        mypy v6-descriptive-statistics/ --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install security scanning dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        
    - name: Run Bandit security linter
      run: |
        bandit -r v6-descriptive-statistics/ -f json -o bandit-report.json || true
        
    - name: Check dependencies for known vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t v6-descriptive-statistics:test .
        
    - name: Test Docker image
      run: |
        docker run --rm v6-descriptive-statistics:test --help || true
        
    - name: Inspect Docker image
      run: |
        docker inspect v6-descriptive-statistics:test
        
  vantage6-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/revamped-version' || github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock docker
        pip install -r requirements.txt
        
    - name: Run Vantage6 integration tests
      run: |
        pytest tests/integration/test_vantage6_integration.py -v --tb=short -m "vantage6 or docker" || true
        
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vantage6-integration-results
        path: |
          tests/
          
  edge-cases:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock
        pip install -r requirements.txt
        
    - name: Run edge case tests
      run: |
        pytest tests/ -v --tb=short -m edge_case
        
  performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark
        pip install -r requirements.txt
        
    - name: Run performance benchmarks
      run: |
        pytest tests/ -k "performance" --benchmark-only --benchmark-json=benchmark-results.json || true
        
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: benchmark-results.json

  quality-gate:
    runs-on: ubuntu-latest
    needs: [test, lint, security, docker]
    if: always()
    
    steps:
    - name: Check all jobs status
      run: |
        if [[ "${{ needs.test.result }}" != "success" ]]; then
          echo "Tests failed"
          exit 1
        fi
        if [[ "${{ needs.lint.result }}" != "success" ]]; then
          echo "Linting failed"
          exit 1
        fi
        if [[ "${{ needs.security.result }}" != "success" ]]; then
          echo "Security checks failed"
          exit 1
        fi
        if [[ "${{ needs.docker.result }}" != "success" ]]; then
          echo "Docker build failed"
          exit 1
        fi
        echo "All quality gates passed"