[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for complete workflows
    empirical: Empirical validation tests comparing federated vs centralised
    docker: Docker build and deployment tests
    vantage6: Vantage6 infrastructure integration tests
    edge_case: Edge case and error condition tests
    slow: Tests that take longer to run
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning